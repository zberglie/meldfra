[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "meldfra"
version = "0.1.0"
description = "«Meld fra»-knapp med KI-intervju, personvern og speiling til GitHub/GitLab Issues"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "anthropic>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "uvicorn>=0.29"]

[tool.setuptools]
packages = ["meldfra"]

[tool.setuptools.package-data]
meldfra = ["static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
